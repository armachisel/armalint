name: Package

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Install wheel in an isolated environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/armalint-smoke"
          "$RUNNER_TEMP/armalint-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/armalint-smoke/bin/python" -I -m armalint --version
          "$RUNNER_TEMP/armalint-smoke/bin/python" -I -m armalint --json "$GITHUB_WORKSPACE/tests/fixtures/clean.sqf"
      - name: Verify installed package data
        shell: bash
        run: |
          "$RUNNER_TEMP/armalint-smoke/bin/python" -c "from importlib.resources import files; assert files('armalint').joinpath('data/commands.txt').is_file(); assert files('armalint').joinpath('data/command_metadata.json').is_file()"
      - name: Run regression suite
        run: python tests/run_all.py
      - name: Verify console scripts
        shell: bash
        run: |
          armalint --version
          armalint-update --help
          armalint-update-commands --help
          armalint --json tests/fixtures/clean.sqf
          armalint-mcp </dev/null || true
