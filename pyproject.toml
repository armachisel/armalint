[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "armalint"
version = "0.1.0"
description = "Arma 3 SQF linter"
readme = "README.md"
license = {file = "LICENSE"}
license-files = ["LICENSE"]
authors = [{name = "Armalint contributors"}]
requires-python = ">=3.9"
keywords = ["arma 3", "sqf", "linter", "static analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
docs = ["mkdocs-material>=9.6,<10"]

[project.scripts]
armalint = "armalint.__main__:_main"
armalint-update = "armalint.update:main"
armalint-update-commands = "armalint.update_commands:main"
armalint-mcp = "armalint.mcp_server:main"
armalint-watch = "armalint.watch:main"
armalint-lsp = "armalint.lsp:main"

[tool.hatch.build.targets.wheel]
packages = ["armalint"]

[tool.hatch.build.targets.sdist]
include = ["armalint", "docs", "tests", "README.md", "LICENSE", "pyproject.toml"]
