[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "armalint"
version = "0.1.0"
description = "Arma 3 SQF linter"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["arma 3", "sqf", "linter", "static analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
docs = ["mkdocs-material>=9.6,<10"]

[project.scripts]
armalint = "armalint.__main__:_main"
armalint-update = "armalint.update:main"
armalint-update-commands = "armalint.update_commands:main"

[tool.setuptools.packages.find]
include = ["armalint*"]

[tool.setuptools.package-data]
armalint = ["data/commands.txt"]
