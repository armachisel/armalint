[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "armalint"
version = "0.1.0"
description = "Arma 3 SQF linter"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["armalint*"]

[tool.setuptools.package-data]
armalint = ["data/commands.txt"]
